services:

  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"

 

  server-1:
    build: .
    container_name: rate-limiter-server-1
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis

  server-2:
    build: .
    container_name: rate-limiter-server-2
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis